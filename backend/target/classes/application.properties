spring.application.name=kiosk-backend
server.port=8080

# No database - all demo data is loaded from mock-data.json into memory
# at startup by MockDataStore. Edit that file to add/change test data.

# ---------------------------------------------------------------------------
# AI provider mode - controls GeminiService / WhisperService vs the offline
# rule-based mocks (MockNluService / MockWhisperService). See
# ResilientNluService / ResilientSpeechTranscriber for the full behaviour.
#
#   mock  - never call the network. Unlimited, free, fully offline. Safe
#           default - use this until you've set your OWN api keys below.
#   live  - always call the real Gemini/Groq APIs; fails if they fail.
#   auto  - try the real API first, silently fall back to mock on any
#           failure (timeout, bad key, quota exceeded, network down).
# ---------------------------------------------------------------------------
kiosk.ai.mode=mock
kiosk.ai.live.timeout-ms=4000

# Gemini API - get your own free key from https://aistudio.google.com/apikey
# and export it as an env var; never commit real keys to source control.
# The key that shipped in this project before was hardcoded in plain text,
# which means it was exposed to anyone with the zip/repo - treat it as
# compromised and rotate/delete it in Google AI Studio.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent

# Groq API (Whisper speech-to-text) - free key from https://console.groq.com/keys.
# Same rotation note as above applies to the key that used to be hardcoded here.
groq.api.key=${GROQ_API_KEY:}

# Allow up to ~5MB audio clips (a few seconds of spoken audio) - relevant
# only if/when the Whisper stretch goal is wired up
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
